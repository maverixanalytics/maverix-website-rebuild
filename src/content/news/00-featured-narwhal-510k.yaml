headline: "Maverix Medical Announces FDA 510(k) Clearance for the Narwhal™ Cryo System"
summary: "Maverix Medical, a company focused on revolutionizing the diagnosis and treatment of lung cancer, today announced that the U.S. Food and Drug Administration granted 510(k) clearance for the Maverix Narwhal™ Cryo System, a single-use flexible cryoprobe that requires no console — bringing cryobiopsy to the bronchoscopy suite without dedicated capital equipment."
