headline: "Maverix Medical Expands the Narwhal™ Cryo Portfolio with FDA Clearance of the Narwhal Pro"
summary: "Maverix Medical, a company focused on revolutionizing the diagnosis and treatment of lung cancer, has augmented its console-free cryoprobe portfolio. Today the company announced that the U.S. Food and Drug Administration granted 510(k) clearance on September 2, 2026, to the Maverix Narwhal™ Pro Cryo System, the second of two flexible cryoprobes built on the same cartridge-powered architecture."
